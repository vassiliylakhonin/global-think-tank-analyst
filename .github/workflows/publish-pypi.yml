name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        default: "v1.6.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: python -m pip install ".[test,mcp]" "twine==7.0.0"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python -c "import os, pathlib, tomllib; expected = os.environ['RELEASE_TAG'].removeprefix('v'); actual = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert actual == expected, f'{actual} != {expected}'"

      - name: Run tests
        run: python -m pytest -q

      - name: Run repository checks
        run: python scripts/check.py

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: python scripts/test_wheel_install.py

      - name: Upload distributions for publish job
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/global-think-tank-analyst
    permissions:
      id-token: write
    # Trusted Publishing is the destination, and registering the publisher needs
    # a PyPI web login this account cannot currently perform: two-factor access
    # was lost and pypi/support#12033 is still open. That blocked every release
    # from 1.4.0 onward, while the sibling repository kept publishing on a
    # stored account-scoped token throughout. So accept either credential and
    # prefer the token while it is the one that works. Delete the token step,
    # and the secret, once the publisher is registered.
    env:
      HAS_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Report which credential will be used
        run: |
          if [ "$HAS_API_TOKEN" = "true" ]; then
            echo "Publishing with the stored PYPI_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No PYPI_API_TOKEN set; attempting Trusted Publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish with a stored API token
        if: env.HAS_API_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true

      - name: Publish with PyPI Trusted Publishing
        if: env.HAS_API_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
