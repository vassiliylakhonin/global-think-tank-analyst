name: Policy Risk Signal

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Signal date (YYYY-MM-DD). Defaults to today's UTC date."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate a Policy Risk Signal draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=Policy Risk Signal::OPENAI_API_KEY is not configured for this repository, so this run cannot generate anything. Set the OPENAI_API_KEY repository secret (Settings -> Secrets and variables -> Actions), or write the signal by hand from signals/TEMPLATE.md."
            exit 1
          fi
          DATE_INPUT="${{ inputs.date }}"
          if [ -n "$DATE_INPUT" ]; then
            ./scripts/generate_policy_risk_signal.py --date "$DATE_INPUT"
          else
            ./scripts/generate_policy_risk_signal.py
          fi

      - name: Show generated changes
        run: git diff -- signals/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/policy-risk-signal
          delete-branch: true
          commit-message: "docs: add policy risk signal draft"
          title: "docs: add Policy Risk Signal draft"
          body: |
            Policy Risk Signal draft from a manual workflow run.

            This repository's signal archive is maintained by hand: the normal
            route is to copy `signals/TEMPLATE.md` and open a pull request. This
            draft is a starting point, not a finished signal.

            Review checklist:
            - [ ] Sources are real and relevant
            - [ ] Facts are source-backed
            - [ ] Assessment is bounded and not legal/compliance/investment advice
            - [ ] `signals/` index, feed, latest, and archive list agree (`python3 scripts/validate_signals.py`)
          labels: |
            documentation
            automated-signal
