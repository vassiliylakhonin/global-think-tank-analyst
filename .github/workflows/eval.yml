name: Prompt Evaluation (LLM-as-a-Judge)

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'SKILL_RU.md'
      - 'evals/promptfooconfig.yaml'

jobs:
  promptfoo-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Install promptfoo
        run: npm install -g promptfoo
        
      - name: Run promptfoo evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is not set. Skipping evaluation."
            exit 0
          fi
          cd evals
          promptfoo eval
