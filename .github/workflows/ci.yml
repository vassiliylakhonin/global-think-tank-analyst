name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install package and test dependencies
        run: pip install -e ".[test,agent,langchain,llamaindex,mcp]"
        
      - name: Run Pytest
        run: pytest tests/

      - name: Run repository checks
        run: python3 scripts/check.py
