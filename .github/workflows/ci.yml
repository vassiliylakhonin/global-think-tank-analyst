name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  minimal-core-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install core package only
        run: pip install -e .

      - name: Import optional agent module without its dependencies
        run: python -c "from gtta.agent import AnalystAgent; assert AnalystAgent.__name__ == 'AnalystAgent'"

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install package and test dependencies
        run: pip install -e ".[test,agent,llamaindex,mcp]"
        
      - name: Run Pytest
        run: pytest tests/

      - name: Run repository checks
        run: python3 scripts/check.py

      - name: Build wheel
        run: python3 -m build --wheel

      - name: Smoke-test installed wheel
        run: python3 scripts/test_wheel_install.py

  agenda-1-9-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GTTA test dependencies and pinned Agenda release
        run: pip install -e ".[test]" "agenda-intelligence-md==1.9.0"

      - name: Run the real composition-seam test
        run: pytest -q tests/test_verification_integration.py

      - name: Run golden and negative-control benchmark
        run: python scripts/run_verification_benchmark.py

      - name: Upload benchmark receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memo-verification-benchmark
          path: artifacts/

      - name: Upload benchmark SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/verification-benchmark.sarif
          category: gtta-memo-verification-benchmark
