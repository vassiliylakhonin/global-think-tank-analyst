name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL frontmatter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p = Path('SKILL.md')
          if not p.exists():
              print('SKILL.md missing')
              sys.exit(1)
          t = p.read_text(encoding='utf-8')
          if not t.startswith('---\n'):
              print('Frontmatter missing')
              sys.exit(1)
          end = t.find('\n---\n', 4)
          if end == -1:
              print('Frontmatter closing delimiter missing')
              sys.exit(1)
          fm = t[4:end]
          if not re.search(r'^name:\s*\S+', fm, re.M):
              print('name missing in frontmatter')
              sys.exit(1)
          if not re.search(r'^description:\s*.+', fm, re.M):
              print('description missing in frontmatter')
              sys.exit(1)
          print('Frontmatter OK')
          PY

      - name: Validate signal JSON feeds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import sys

          required = {
              Path("signals/index.json"): ("title", "description", "latest", "signals"),
              Path("signals/feed.json"): ("version", "title", "home_page_url", "feed_url", "items"),
          }

          for path, keys in required.items():
              if not path.exists():
                  print(f"{path} missing")
                  sys.exit(1)
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"{path} invalid JSON: {exc}")
                  sys.exit(1)
              missing = [key for key in keys if key not in data]
              if missing:
                  print(f"{path} missing keys: {missing}")
                  sys.exit(1)
              if path.name == "index.json" and not isinstance(data["signals"], list):
                  print("signals/index.json: signals must be a list")
                  sys.exit(1)
              if path.name == "feed.json" and not isinstance(data["items"], list):
                  print("signals/feed.json: items must be a list")
                  sys.exit(1)

          print("Signal JSON feeds OK")
          PY
