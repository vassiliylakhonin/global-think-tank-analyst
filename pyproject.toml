[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-think-tank-analyst"
version = "1.6.0rc1"
description = "Experimental strategic-risk reasoning framework for AI agents with versioned memo contracts, CLI, and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "langgraph", "mcp", "geopolitics", "risk-analysis", "evidence"]
authors = [
    {name = "Vassiliy Lakhonin"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
gtta = "gtta.cli:app"

[project.optional-dependencies]
docs = ["mkdocs-material"]
eval = ["promptfoo"]
ui = ["streamlit>=1.30.0", "requests>=2.31.0"]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
mcp = ["mcp>=2.0,<3"]
agent = ["langchain-core>=0.1.0", "langchain-openai", "langchain-community", "duckduckgo-search", "tavily-python", "langgraph", "networkx"]
test = ["build>=1.2.0", "pytest>=7.0.0", "pytest-asyncio", "fastapi>=0.115.0"]
dspy = ["dspy-ai"]
enterprise = ["fastapi", "uvicorn", "pypdf", "faiss-cpu", "langchain-huggingface"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gtta.skills" = ["*.md"]
