[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-think-tank-analyst"
version = "1.4.0"
description = "Experimental strategic-risk reasoning framework with memo scaffolding, MCP, and an optional LangGraph pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["ai-agents", "langgraph", "mcp", "geopolitics", "risk-analysis", "evidence"]
authors = [
    {name = "Vassiliy Lakhonin"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mcp>=0.1.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0"
]

[project.scripts]
gtta = "gtta.cli:app"

[project.optional-dependencies]
docs = ["mkdocs-material"]
eval = ["promptfoo"]
ui = ["streamlit>=1.30.0", "requests>=2.31.0"]
agent = ["langchain-openai", "langchain-community", "duckduckgo-search", "tavily-python", "langgraph", "networkx"]
test = ["pytest>=7.0.0", "pytest-asyncio", "fastapi>=0.115.0"]
dspy = ["dspy-ai"]
enterprise = ["fastapi", "uvicorn", "pypdf", "faiss-cpu", "langchain-huggingface"]

[tool.setuptools.packages.find]
where = ["src"]
