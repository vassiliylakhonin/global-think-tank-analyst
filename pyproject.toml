[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-think-tank-analyst"
version = "1.5.0"
description = "Experimental strategic-risk reasoning framework with memo scaffolding, MCP, and an optional LangGraph pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["ai-agents", "langgraph", "mcp", "geopolitics", "risk-analysis", "evidence"]
authors = [
    {name = "Vassiliy Lakhonin"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
gtta = "gtta.cli:app"
gtta-mcp = "gtta.mcp_server:main"

[project.optional-dependencies]
docs = ["mkdocs-material"]
mcp = ["mcp>=2.0,<3"]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
eval = ["promptfoo"]
ui = ["streamlit>=1.30.0", "requests>=2.31.0"]
agent = ["langchain-openai", "langchain-community", "duckduckgo-search", "tavily-python", "langgraph", "networkx"]
test = ["pytest>=7.0.0", "pytest-asyncio", "fastapi>=0.115.0", "build", "mcp>=2.0,<3"]
dspy = ["dspy-ai"]
enterprise = ["fastapi", "uvicorn", "pypdf", "faiss-cpu", "langchain-huggingface"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The analytical method IS the product. Ship it inside the package so an
# installed copy carries it; a wheel without these files is an empty shell.
gtta = ["skills/*.md"]

