[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-think-tank-analyst"
version = "1.4.0"
description = "Strategic-risk analysis skill for AI agents, packaged as a developer toolkit with a CLI, MCP server, and framework connectors."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Vassiliy Lakhonin"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mcp>=0.1.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0"
]

[project.scripts]
gtta = "gtta.cli:app"

[project.optional-dependencies]
docs = ["mkdocs-material"]
eval = ["promptfoo"]
ui = ["streamlit>=1.30.0"]
agent = ["langchain-openai", "langchain-anthropic", "tavily-python", "langgraph"]

[tool.setuptools.packages.find]
where = ["src"]
